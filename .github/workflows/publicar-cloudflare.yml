# Publica la web en Cloudflare Pages y la conecta a avicolag.boacgro.com.
# Requiere dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  · permisos: Account › Cloudflare Pages: Edit · Zone › DNS: Edit · Zone › Zone: Read (boacgro.com)
#   CLOUDFLARE_ACCOUNT_ID · ID de la cuenta de Cloudflare
name: Publicar en Cloudflare Pages

on:
  push:
    branches: [claude/web-avicola-garces]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-cloudflare
  cancel-in-progress: true

env:
  PROJECT: avicolag
  BRANCH: claude/web-avicola-garces
  ZONE: boacgro.com
  HOST: avicolag.boacgro.com

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Revisar secretos
        id: check
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::warning::Faltan los secretos CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID. No se publica."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Preparar archivos públicos
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir dist
          cp index.html robots.txt sitemap.xml _headers dist/
          cp -r assets dist/
          rm -f dist/assets/fonts/LICENSE-*.txt
          du -sh dist

      - name: Crear el proyecto si no existe
        if: steps.check.outputs.ok == 'true'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CF_TOKEN" "$api/$PROJECT")
          if [ "$code" = "404" ]; then
            curl -sf -X POST "$api" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"name\":\"$PROJECT\",\"production_branch\":\"$BRANCH\"}" > /dev/null
            echo "Proyecto $PROJECT creado"
          elif [ "$code" = "200" ]; then
            echo "Proyecto $PROJECT ya existe"
          else
            echo "::error::No se pudo consultar el proyecto (HTTP $code). Revisa los permisos del token."; exit 1
          fi

      - name: Publicar
        if: steps.check.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.17 pages deploy dist --project-name="$PROJECT" --branch="$BRANCH" --commit-dirty=true

      - name: Conectar el subdominio
        if: steps.check.outputs.ok == 'true'
        run: |
          auth=(-H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          # 1) Dominio personalizado en el proyecto de Pages
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains" \
            "${auth[@]}" --data "{\"name\":\"$HOST\"}" | grep -q '"success":true' \
            && echo "Dominio $HOST agregado al proyecto" || echo "Dominio $HOST ya estaba agregado (o revisar en el panel)"
          # 2) Registro DNS CNAME en la zona
          zone=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=$ZONE" "${auth[@]}" | python3 -c 'import sys,json; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          if [ -z "$zone" ]; then echo "::error::No se encontró la zona $ZONE en esta cuenta."; exit 1; fi
          existing=$(curl -s "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$HOST" "${auth[@]}" | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["result"]))')
          if [ "$existing" = "0" ]; then
            curl -sf -X POST "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" "${auth[@]}" \
              --data "{\"type\":\"CNAME\",\"name\":\"avicolag\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" > /dev/null
            echo "CNAME avicolag → $PROJECT.pages.dev creado"
          else
            echo "Ya existe un registro DNS para $HOST; no se modifica"
          fi
          echo "Listo: https://$HOST"
